services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: eduportal:prod
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Set to 'false' if you apply migrations via CI/CD instead of at startup
      RUN_MIGRATIONS: "true"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
